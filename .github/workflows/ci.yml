name: CI and Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and runtime dependencies
        run: python -m pip install -e .

      - name: Compile Python source and tests
        run: python -m compileall -q src tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Evaluate decision baseline
        run: python -m krisona_ai.recommendation_evaluator

  security:
    name: Static analysis and dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install project and development security tools
        run: python -m pip install -e . -r requirements-dev.txt

      - name: Scan application source
        run: bandit -q -r src -ll

      - name: Audit installed dependencies
        run: pip-audit
